extra:
  social:
    # RU-maintainer contacts (github.com/imgusev, imgusev.ru, @imgusev) —
    # see _meta/docs/BRANDING.md. The upstream repo is still credited via
    # repo_url above and the NOTICE/README attribution blocks.
    - icon: fontawesome/brands/github
      link: https://github.com/imgusev
      name: GitHub
    - icon: fontawesome/solid/globe
      link: https://imgusev.ru
      name: Сайт
    - icon: fontawesome/brands/telegram
      link: https://t.me/imgusev
      name: Telegram
  generator: false

extra_css:
  - stylesheets/extra.css

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
      permalink_title: Ссылка на этот раздел
      # Unicode-safe slugify — Cyrillic headings in *.ru.md need this for
      # working TOC anchors/permalinks (neutral no-op on English headings).
      slugify: !!python/object/apply:pymdownx.slugs.slugify
        kwds:
          case: lower
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.betterem:
      smart_enable: all
  - pymdownx.caret
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.smartsymbols
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
      combine_header_slug: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tilde

