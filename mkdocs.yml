site_name: Скиллы и плагины агентов Claude Code (RU)
site_url: https://imgusev.github.io/claude-skills-ru/
site_description: "Русскоязычный перевод библиотеки из 345+ готовых к использованию агентских скиллов, 78 устанавливаемых плагинов и 90+ слэш-команд в 17 доменах — инженерия, продукт, маркетинг, комплаенс, финансы и исследования. Работает с Claude Code, OpenAI Codex, Gemini CLI, Cursor, Hermes Agent, Mistral Vibe, OpenClaw и ещё 6 инструментами. Открытый исходный код, лицензия MIT, без зависимостей."
site_author: Ilya Gusev
repo_url: https://github.com/imgusev/claude-skills-ru
repo_name: imgusev/claude-skills-ru
edit_uri: edit/main/docs/
copyright: "© 2026 Ilya Gusev · русский перевод. Оригинал © Alireza Rezvani (MIT)"

theme:
  name: material
  custom_dir: docs/overrides
  language: ru
  palette:
    - scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  font:
    text: Inter
    code: JetBrains Mono
  features:
    - navigation.instant
    - navigation.instant.progress
    - navigation.tracking
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.expand
    - navigation.path
    - navigation.top
    - navigation.indexes
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.code.annotate
    - content.action.edit
    - content.tabs.link
    - header.autohide
    - toc.follow
    - announce.dismiss
  icon:
    repo: fontawesome/brands/github
    annotation: material/chevron-right-circle

plugins:
  - search:
      separator: '[\s\-\.]+'
      lang:
        - ru
        - en
  # i18n (mkdocs-static-i18n==1.3.1, suffix mode): 'en' unsuffixed files
  # (SKILL.md, index.md, ...) are physically the untouched English
  # original, so 'en' must own the structural `default` (file ownership +
  # root URL — this plugin version does not separate the two, see ARCH-7
  # in _meta/docs/ASSUMPTIONS.md). Suffixed `*.ru.md` siblings are 'ru'.
  # 'ru' is served under /ru/ and reached via the language switcher
  # (reconfigure_material) or by following a link from the (also
  # bilingual) home page — not via the root URL.
  - i18n:
      docs_structure: suffix
      fallback_to_default: true
      reconfigure_material: true
      reconfigure_search: true
      languages:
        - locale: en
          name: English
          build: true
          default: true
        - locale: ru
          name: Русский
          build: true
          # Populated by tooling/build_nav_translations.py (§3.4
